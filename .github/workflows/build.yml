name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests (logic, nag engine, encryption, UI screenshots)
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: app/build/screenshots/

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PERMATASKS_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "PERMATASKS_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          PERMATASKS_KEYSTORE_PASSWORD: ${{ secrets.PERMATASKS_KEYSTORE_PASSWORD }}
          PERMATASKS_KEY_ALIAS: ${{ secrets.PERMATASKS_KEY_ALIAS }}
          PERMATASKS_KEY_PASSWORD: ${{ secrets.PERMATASKS_KEY_PASSWORD }}
          PERMATASKS_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Verify the APK has no internet permission
        run: |
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          if $AAPT dump permissions app/build/outputs/apk/release/app-release.apk | grep -q "android.permission.INTERNET"; then
            echo "::error::INTERNET permission found in APK"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: permatasks-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
